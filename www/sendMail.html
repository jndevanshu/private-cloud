<!DOCTYPE html>
<html>

<head>
    <title>Send Mail</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
    <script src="/js/sendMail.js"></script>
    <meta charset="utf-8">
</head>
<body>
    
    <form action="/cgi-bin/sendMail" method="post" enctype="multipart/form-data" id="send-mail-form">
        To:
        <input type="text" name="rcptTo" id="rcptTo">
        <br>
        Subject:
        <input type="text" name="subject" id="subject">
        <br>
        Message:
        <input type="file" name="attachment" id="attachment">
        <br><br>
        <input type="submit" value="Send Mail">
    </form> 
    <textarea rows="4" cols="50" name="message" form="sendMail" id="message">Enter text here...</textarea>

</body>

</html>
